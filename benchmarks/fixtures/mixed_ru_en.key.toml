# The answer key for mixed_ru_en.vtt — a fictional meeting authored for story 7a.
#
# Nothing in either file comes from a real meeting. Four speakers, labelled
# `Speaker 1`–`Speaker 4`, 200 cues in mixed Russian and English.
#
# A planted item is found when one returned item carries its key token (and,
# for an action item, its owner label too). A distractor is a proposal raised
# and rejected in the meeting: it must not come back as a decision.

