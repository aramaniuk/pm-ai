- id: "16"
  title: Closed-loop verification and evidence admissibility
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Transition commitment states from harvested execution telemetry and surface
    met, altered, broken and stalled promises. Delivers CAP-33.
  invoke_dev_with: >-
    pm-ai's own writes are never evidence - every event carries an authorship
    marker and only external is admissible. An overdue commitment resolves by
    what pm-ai attempted, not only by what it found, and the three outcomes are
    never collapsed: a harvest that succeeded across the arrival window and
    found nothing is BROKEN; no successful harvest spanning it with no failed
    attempt is UNKNOWN, which is temporary and self-resolving; any contributing
    instance that attempted and failed is ERROR, which waiting never clears.
    ERROR outranks UNKNOWN when both apply. evaluate_commitment currently takes
    a single covered boolean and no health input at all - that is the signature
    to change.
