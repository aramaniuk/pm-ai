- id: "1a"
  title: Scope path resolver
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Anchor the four scope trees to real filesystem roots behind a single
    resolver, so no component derives its own path for an artifact. Foundation
    for the scope Constraints and scope-model.md.
- id: "1b"
  title: Storage writes through the resolver
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Route every storage write through that resolver with an injected clock, so
    the open monthly segment filename is deterministic and testable. Holds the
    single-writer rule in storage-contract.md.
- id: "1c"
  title: Refuse unprotected captures
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Ask git whether a capture directory would be carried into a commit, and
    refuse the write when it would or when git cannot answer. Delivers the
    project-scope half of the capture guard.
- id: "1k"
  title: Type-checking gate
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Add mypy at default settings, fix the ten errors it reports, and gate it
    inside pytest the way import-linter already is. Makes every Protocol in
    pm_ai/ports/ enforced rather than documented.
  invoke_dev_with: >-
    A missing mypy binary fails the gate, never skips it - the same rule as the
    import-linter gate, for the same reason. Do not silence
    storage/service.py:400 ("ScopePathPort has no attribute repository") with a
    cast: the error is not the problem, the coupling is, and a cast removes the
    only signal that it exists. The concrete type is not an option either, since
    pm_ai.storage may not import pm_ai.platform. Every "type: ignore" carries an
    error code and a reason, and no Any is introduced to make an error go away.
- id: "1l"
  title: Guards that survive optimization
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Convert the ten import-time asserts that verify the scope model into typed
    raises, so `python -O` cannot strip the only checks establishing that the
    derived tier and exclusion sets are coherent.
  invoke_dev_with: >-
    Ten sites, and an AST sweep confirms there are no other asserts in pm_ai/ -
    lifecycle.py:63, scope_model.py:818/824/829/841/844/847/855,
    storage_tiers.py:194/202. Keep every message verbatim: several are the
    clearest statement of their invariant anywhere in the repo, and shortening
    them during a mechanical conversion is how a refactor deletes documentation.
    Do not relocate the checks into tests - the guard must refuse a model someone
    hand-edits after install, not just prove this repo's model is fine. The
    __post_init__ checks on File, Dir and Collection already raise; follow them.
- id: "1d"
  title: Keychain port and macOS adapter
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Establish master-key custody in the OS keychain behind a port, so the daemon
    starts unattended without a passphrase prompt. Custody only; nothing
    encrypts anything yet.
  invoke_dev_with: >-
    Import keyring inside the function that uses it, never at module top level.
    It is not installed here, and the suite's mod() helper turns a
    ModuleNotFoundError into a skipped test - so a top-level import converts
    this story's tests into skips that read as coverage. No real keychain access
    in the suite, and no secret written anywhere durable outside the keychain.
- id: "1e"
  title: Encryption classifier
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Declare encryption on each scope-tree node and derive the encrypted set from
    the trees, exposing one pure predicate over a path. Policy only - no cipher,
    no key.
  invoke_dev_with: >-
    An undeclared path classifies as encrypted, never plaintext: that is what
    satisfies the two stale assertions (event_telemetry.db, chat_history/)
    without reviving either name in a tree. Declare encryption where the
    artifact is declared, so a new artifact cannot be added without an answer -
    do not maintain a second table beside the trees. All three transcripts/
    declarations take one answer.
- id: "1f"
  title: Envelope cipher and encrypted operational store
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Add an envelope cipher over an injected key and open the Tier-2 operational
    store encrypted at mode 0600. Delivers the encrypted-set half of
    storage-contract.md.
  invoke_dev_with: >-
    Fail closed: a missing key refuses to open the store and there is no
    fallback to plaintext. Import sqlcipher3 inside the function that uses it,
    for the same skip-as-coverage reason as 1d. pm_ai.storage may not import
    pm_ai.platform, so the key is fetched in app/wiring.py - the only module
    permitted to import both - and passed down as a value.
- id: "1g"
  title: Startup diagnostics
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Four read-only probes that report rather than raise: sqlite extension
    support, keychain reachability, encryption-toggle state, and the git
    dependency of the capture write path.
  invoke_dev_with: >-
    Assert hasattr(conn, "enable_load_extension") on a real connection object,
    not on the Python version string - a stock macOS Python cannot load
    sqlite-vec at all, and the failure surfaces deep inside the single writer on
    a clean install. Probe git the same way, by running one real exclusion
    query: shutil.which passes for a stub that would still refuse every capture.
    Report binary-absent and cannot-answer as distinct results, and let every
    probe run even when one fails.
- id: "1h"
  title: Derived-tier rebuild
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Snapshot, drop and rebuild the derived tier from the Markdown, every drop
    validated against the tier table first. Proves the Tier-3 zero-loss promise
    in storage-contract.md.
- id: "1i"
  title: Operational schema versioning
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Stamp the operational store with a schema version and apply forward-only
    ordered migrations that preserve existing rows. Covers the one tier no
    rebuild can reconstruct.
  invoke_dev_with: >-
    Forward-only and ordered, each migration applied at most once, never
    drop-and-recreate on the tier nothing rebuilds. Migrations run at
    construction before any other statement, and a store stamped newer than the
    code refuses to open, naming both versions. Replace the existing PRAGMA
    table_info sniff in _migrate rather than adding beside it, and leave the
    version unchanged when a migration fails partway.
- id: "1j"
  title: Capture guard covers every scope
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Widen the capture guard from the project scope to every capture location,
    keyed on whether the path lies inside a git working tree. Closes the gap
    where personal and team-member captures were written without asking git.
  invoke_dev_with: >-
    Unknown is not permission: no git binary, a timeout, or an unrecognised exit
    refuses the write, in every scope. Only "this path is not inside a working
    tree" permits it, because that is an answer git gave rather than one it
    failed to give. Derive the .gitignore path from the working-tree root git
    reports - never re-key GITIGNORE_REQUIRED per scope, which the basename rule
    forbids. test_a_capture_in_an_uncommitted_scope_is_unaffected asserts the
    behaviour this story replaces: re-derive it around the working-tree reason,
    do not delete it.
- id: "2"
  title: Event log and disclosure ledger
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Implement the segmented, append-only per-scope event log with typed entries
    and the separate application-scoped disclosure ledger for frontier-call
    provenance and cost. Delivers CAP-10 and CAP-27.
- id: "3"
  title: MCP execution firewall and skill registry
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Build the execution boundary, the non-destructive input sanitization layer,
    and the allowlisted skill registry with declared permissions. Delivers
    CAP-36 and gates every later story that mutates external state.
  invoke_dev_with: >-
    The firewall is fully binding even though skill signing is deferred. The
    registry is a first-party local allowlist with declared permissions; keep
    the skill load path pluggable so verification can be added later without
    restructuring.
- id: "4"
  title: Daemon, loopback API and CLI REPL
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Stand up the single long-lived daemon with loopback-only binding and the
    terminal REPL client that reaches it. Delivers CAP-18.
- id: "5"
  title: Telegram bridge and cryptographic pairing
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Add the outbound long-polling Telegram surface locked to paired user-IDs,
    rejecting everything else. Delivers CAP-19; webhooks are prohibited.
- id: "6"
  title: Dynamic persona engine
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Load persona profiles per scope and let the PM adjust tone and directness
    from either surface without a daemon restart. Delivers CAP-20.
- id: "7"
  title: Local model pipeline - Whisper and Ollama
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Wire local transcription and the 8B-class parsing model behind the model
    port, and benchmark them running concurrently. Delivers the NFR-01 and
    NFR-12 substrate that CAP-1 and CAP-21 build on.
  invoke_dev_with: >-
    Set OLLAMA_MAX_LOADED_MODELS=1, OLLAMA_NUM_PARALLEL=1 and keep_alive: 0
    before dispatching a whisper.cpp job - a client-side pool bound does not
    unload a model. Benchmark concurrent transcription and parsing at the 16GB
    baseline and report the numbers; the hardware floor is an open question
    that this story is meant to answer.
- id: "8"
  title: Connector framework and credential lifecycle
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Build the pull-adapter connector architecture with health probes, event
    normalization, hot plugin loading, and encrypted credential storage.
    Delivers CAP-35.
  invoke_dev_with: >-
    pm_ai/connectors/gitlab.py:62-71 builds its CoverageWindow as now-minus-4h
    to now unconditionally, tied to nothing that proves a fetch happened, so a
    provider declining with an empty 200 claims full coverage it never had.
    HarvestResult has no way to say "I ran and learned nothing" - give it one.
- id: "9"
  title: Passive telemetry radar
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Run the scheduled harvest across configured connectors through the
    sanitization boundary, with backoff on provider failure. Delivers CAP-2.
  invoke_dev_with: >-
    run_harvest in pm_ai/app/pipelines.py:20-36 has no try/except, so a raising
    connector skips save_cursor and the attempt vanishes with it - leaving no
    record that story 16's three verdicts need in order to tell never-looked
    from looked-and-failed.
- id: "10"
  title: Durable job queue and offline replay
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Make every unit of deferred work a durable row with idempotent external
    mutations, buffering offline and replaying in order on reconnect. Delivers
    CAP-4.
- id: "11"
  title: Meeting records and transcript ingestion
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Introduce the Meeting entity as citation root, the provider transcript path
