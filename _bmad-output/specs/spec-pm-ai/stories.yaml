- id: "15"
  title: Commitment ledger and lifecycle
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Persist extracted spoken commitments with their full lifecycle states, an
    append-only audit trail carrying evidence references, and the index CAP-34
    requires. Delivers CAP-34.
  invoke_dev_with: >-
    OWNS THE COMMITMENT INDEX. CAP-34 says "an indexed row at [PENDING]", so the
    story that persists commitments writes the index too - assigned 2026-08-27,
