- id: "10"
  title: Durable job queue and offline replay
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Make every unit of deferred work a durable row with idempotent external
    mutations, buffering offline and replaying in order on reconnect. Delivers
    CAP-4.
- id: "10a"
  title: Task manager and derivation jobs
  spec_checkpoint: true
  done_checkpoint: true
  description: >-
    Build the task manager that owns the job inventory, schedules onto story 10's
    durable queue, and publishes job state changes - plus the change events and
    shared resource accessors every derivation job needs. See
    derivation-services.md.
  invoke_dev_with: >-
    Added 2026-08-27 to close a layer the architecture had assumed and nobody
    owned. AD-9 says "sanitization, dedup, indexing, and persistence happen
    outside the connector, uniformly" without naming what indexes; the pre-written
    suite already expects pm_ai.core.scheduler (test_domain_invariants.py:148);
    and app/pipelines.py holds run_harvest and run_transcript_ingestion as
    functions nothing calls - jobs without a job runner.
    A job declares inputs() and outputs() and does ONE thing. The dependency graph
    is DERIVED from those declarations, never configured: one job's outputs
    intersecting another's inputs is the edge. A job must never enqueue its
    successor - it declares what it produced and the task manager decides what
    that makes stale. Same principle as the scope model deriving tier sets from
    node declarations, and it fails the same way if abandoned: two structures that
    can disagree.
    Change detection is ONE pipeline: system-wide filesystem notifications. Ruled
    2026-08-27, superseding an earlier design where StorageService published its
    own write events. Do not add that second channel - two pipelines answering one
    question can disagree, each needs its own tests, and a job gets triggered twice
    or not at all depending on which fired. The OS sees the hand-editing PM and
    pm-ai with one mechanism. Watching is an OS API, so it goes behind a
    FileWatcherPort with its adapter in pm_ai/platform (AD-26); the task manager
    must not import the watching library. Only Tier-1 and RETENTION_MANAGED
    artifacts are eligible to be watched - transcripts/ is RETENTION_MANAGED and
    must be watched, so Tier 1 alone was too strict. The bound is a permission,
    not a selector: an artifact is watched because a job declares it in inputs().
    What it excludes is Tier 3, which is what stops commitment indexing
    re-triggering itself. ONE WATCHER OWNS EACH WATCHED ARTIFACT and a watcher may
    cover several, so the map is a partition: a change cannot arrive twice by two
    routes or fall between two watchers that each assumed the other had it. A
    watcher then enqueues EVERY job declaring that artifact as an input, not one -
    event_log/ and meetings/ each feed two jobs. A recursive watch needs an EXPLICIT
    exclusion list and transcripts/temp/ is its first member - the capture writer
    stages there before linking to the final name, so a watch covering it fires on
    every staging write and hands transcript processing a growing file, the exact
    failure the staging prevents. Nobody declaring it in inputs() is not protection:
    a recursive watch sees subdirectories whether a job asked or not.
    Do NOT tune a coalescing window for correctness - see storage-contract.md's
    write shapes. Appends need whole-record parsing (no terminating newline, no
    record); bursts need queue dedup on (job, artifact) using AD-20's idempotency
    key, not a timer; captures are atomic already. A window survives only against
    external editors that rewrite in place, worst case one wasted indexer pass. The one gap the pipeline
    cannot close is writes made while nothing was watching: the daemon reconciles
    every watched path at boot, mtime or digest against what the last derivation
    saw. Never periodic - that would be the excluded second pipeline. Attach the
    watcher BEFORE scanning, or a write landing between the scan and the attach is
    lost silently; in that order the overlap is duplicate work, which costs nothing
    because a job rebuilds from its declared inputs. Every index ENTRY stores the
    MD5 of the source file it came from - per entry, not per index, so the
    re-index unit is one source file rather than the whole index. It is also the
    only way a source deleted while the daemon was down is detectable: the index
    holds the set of paths it derived from, so a path with entries and no file
    gets its entries dropped. The checksums live inside the index, never in
    operational.db, which survives the Tier-3 drop that pm-ai reindex performs and
    would leave a rebuilt index skipping files it never read. Hash every source
    file at boot; mtime alone is not trustworthy for exactly the writes this scan
    exists for. MD5 is a change-detection claim only and must never be read as
    integrity or authenticity.
    Every job is a queue row per AD-20, never an in-memory timer. Shared resources
    go through one accessor each (CommitmentLog, EventLog, MeetingRecords), and
    those perform their I/O through StorageService rather than touching files -
    pm_ai/storage forbids file I/O outside service.py.
    Enqueue direct consumers; build no topological sort. Settled 2026-08-27 by
    deriving the live graph: every job either produces Tier 1 and is woken by a
    schedule or an external capture, or produces Tier 3 and is a LEAF, because
    nothing follows an unwatched index being written. No chain exceeds one
    job-to-job edge. Depth is deliberately NOT enforced in code - but no job may
    write an artifact that re-triggers it, or it spins forever. Compaction is one
    predicate from that shape (reads event_log/, writes event_log/) and is saved
    only by being schedule-triggered.
    Three trigger kinds, not two: a change to a watched artifact, a schedule, and a
    DIRECT REQUEST from pm-ai business logic into the task manager (ruled
    2026-08-27) - that is what rule 5's triggering interface is for, and pm-ai
    reindex is the obvious caller. Trigger kind and job identity are independent; a
    requested job whose inputs are unchanged does no work, because staleness is the
    stored per-entry MD5 versus the file, not the word of whoever asked.
    inputs() declares STALENESS, NOT FILE ACCESS. The commitment lifecycle job
    reads commitment_index.db to list open commitments and must NOT declare it:
    that edge means "re-run me when the index changes", which can never fire (Tier
    3 is unwatched) and is not what the job needs - elapsed time is. Blur the two
    meanings and the derived graph stops describing when things run.
