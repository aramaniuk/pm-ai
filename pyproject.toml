[project]
name = "pm-ai"
version = "0.1.0"
description = "Local-first AI PM assistant — daemon, CLI, Telegram bridge, connectors, MCP skills"
requires-python = ">=3.13"

# Runtime dependencies are declared under [project.optional-dependencies] rather
# than here, deliberately: the architecture suite must be runnable before the
# stack resolves. Installing the runtime extra is a Phase 1 concern, and the
# `[mcp]` extra pulls a second web stack that deserves its own resolution pass.
dependencies = []

[project.optional-dependencies]
# The Stack table from ARCHITECTURE-SPINE.md, made executable.
# Versions re-verified against their registries 2026-08-19.
runtime = [
    "anthropic[mcp]",
    "python-telegram-bot==22.8",   # NOT [job-queue] — it embeds a second scheduler
    "ollama",
    "sqlite-vec==0.1.9",           # pre-1.0; a minor bump is a reindex event (AD-3)
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "keyring==25.7.0",
    # AES-256-GCM for the two encrypted files (AD-6). Wheels for macOS arm64, so
    # no source build — the property `sqlcipher3` lacked. Imported lazily in
    # `pm_ai.storage.crypto`, so the package loads without this extra.
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "mypy>=2",
    # Also a dev dependency, deliberately. It is an optional runtime extra so the
    # package imports without it, and the suite must still exercise the real
    # cipher rather than skip — a skipped encryption test reads as coverage.
    "cryptography>=50.0.0",
]

[tool.uv]
# sqlite-vec needs `enable_load_extension`, which is ABSENT from python.org and
# macOS system CPython builds — not merely disabled. A uv-managed interpreter has
# it. Without this the daemon installs, starts, and then fails on the first
# embedding write, inside the single writer, on a clean machine only.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/architecture"]

# Default settings deliberately, not `strict`. Strict adds 14 findings that are
# about annotation completeness rather than correctness (`Missing type arguments
# for generic type "dict"`), and a checker that lands with known-acceptable
# complaints teaches everyone to read red as normal. Zero on arrival is what
# makes a later red result mean something; tightening earns its own slice.
#
# Only `pm_ai` is checked. The suite builds deliberately-wrong values to prove
# the guards reject them, so type errors there are the point rather than a
# defect.
[tool.mypy]
files = ["pm_ai"]
python_version = "3.13"
# The optional runtime extras are not installed in this environment on purpose —
# `keyring` and `sqlite_vec` are imported inside the functions that
# use them so a missing extra cannot become a skipped test that reads as
# coverage. Their absence must not read as a type error.
[[tool.mypy.overrides]]
module = ["keyring.*", "sqlite_vec.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_ai"]
