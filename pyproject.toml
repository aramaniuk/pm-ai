[project]
name = "pm-ai"
version = "0.1.0"
description = "Local-first AI PM assistant — daemon, CLI, Telegram bridge, connectors, MCP skills"
requires-python = ">=3.13"

# Runtime dependencies are declared under [project.optional-dependencies] rather
# than here, deliberately: the architecture suite must be runnable before the
# stack resolves. Installing the runtime extra is a Phase 1 concern, and the
# `[mcp]` extra pulls a second web stack that deserves its own resolution pass.
dependencies = []

# The one thing installing this package puts on an operator's PATH. `main()`
# returns an exit code and the console-script wrapper passes it to `sys.exit`,
# so the table in `pm_ai.surfaces.cli.dispatch` is what a shell actually sees.
[project.scripts]
pm-ai = "pm_ai.app.entry:main"

[project.optional-dependencies]
# The Stack table from ARCHITECTURE-SPINE.md, made executable.
# Versions re-verified against their registries 2026-08-19.
runtime = [
    # PINNED EXACTLY 2026-08-28, verified against PyPI and by introspection.
    # The spine calls this the one dependency that must never float, because
    # AD-16 makes the BETA `client.beta.messages.tool_runner` load-bearing for
    # the execution firewall — and it was the only unpinned one.
    #
    # 1.2.0 rather than the 0.124.0 the lockfile had resolved: `messages.create`
    # in 1.x no longer accepts `temperature`/`top_p`/`top_k`, which is what the
    # Claude 5 API already rejects with a 400. The older SDK is the riskier one
    # here — it accepts parameters the API refuses. Confirmed present in 1.2.0:
    # `beta.messages.tool_runner`, and `mcp<3,>=1.0` behind the extra.
    # Confirmed absent: the three sampling parameters. `[mcp]` also pulls
    # `httpx2>=2`, the second web stack the Stack table budgets for.
    "anthropic[mcp]==1.2.0",
    "python-telegram-bot==22.8",   # NOT [job-queue] — it embeds a second scheduler
    "ollama",
    "sqlite-vec==0.1.9",           # pre-1.0; a minor bump is a reindex event (AD-3)
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "keyring==25.7.0",
    # PINNED EXACTLY 2026-09-06, resolved against PyPI and introspected in a
    # throwaway venv — the discipline the `anthropic` entry above documents,
    # applied because this one is a *credential* path. Story 33a's device-code
    # flow is the only thing that obtains a Microsoft token, and a floating
    # minor that changed how `_decorate_scope` treats reserved scopes would
    # change what the PM is asked to consent to without a diff.
    #
    # Two behaviours measured in 1.38.0 that the adapter is written against, and
    # that this pin is what keeps true:
    #   - `offline_access` is REFUSED as a user-provided scope ("The reserved
    #     list: ['offline_access', 'openid', 'profile']") and added by MSAL
    #     itself, so the declared set and the requested list differ by design.
    #   - `obtain_token_by_device_flow` owns the polling loop, honours the
    #     `interval` from the device-code response, and adds RFC 8628's five
    #     seconds on `slow_down`. The adapter therefore runs no loop of its own,
    #     which is also what AD-9 requires of anything in `pm_ai.connectors`.
    #
    # Imported lazily in `pm_ai.connectors.graph.auth`, so the package loads
    # without this extra and a missing install is a typed refusal rather than a
    # skipped test that reads as coverage.
    "msal==1.38.0",
    # AES-256-GCM for the two encrypted files (AD-6). Wheels for macOS arm64, so
    # no source build — the property `sqlcipher3` lacked. Imported lazily in
    # `pm_ai.storage.crypto`, so the package loads without this extra.
    "cryptography>=50.0.0",
    # AD-46's FileWatcherPort adapter — the single change-detection pipeline.
    # Declared here though nothing imports it yet, which is this extra's whole
    # pattern: five of the six entries above have no importer either. It was
    # named in the spine's Stack table on 2026-08-27 and left undeclared, so the
    # table asserted a pin the build did not hold — the same drift the anthropic
    # entry had in the other direction. Latest release is 2024-11-01, a standing
    # currency risk of `sqlite-vec`'s shape over a far smaller surface, and
    # behind a port, so replacing the backend stays local.
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "mypy>=2",
    # Also a dev dependency, deliberately. It is an optional runtime extra so the
    # package imports without it, and the suite must still exercise the real
    # cipher rather than skip — a skipped encryption test reads as coverage.
    "cryptography>=50.0.0",
]

[tool.uv]
# sqlite-vec needs `enable_load_extension`, which is ABSENT from python.org and
# macOS system CPython builds — not merely disabled. A uv-managed interpreter has
# it. Without this the daemon installs, starts, and then fails on the first
# embedding write, inside the single writer, on a clean machine only.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/architecture"]

# Default settings deliberately, not `strict`. Strict adds 14 findings that are
# about annotation completeness rather than correctness (`Missing type arguments
# for generic type "dict"`), and a checker that lands with known-acceptable
# complaints teaches everyone to read red as normal. Zero on arrival is what
# makes a later red result mean something; tightening earns its own slice.
#
# Only `pm_ai` is checked. The suite builds deliberately-wrong values to prove
# the guards reject them, so type errors there are the point rather than a
# defect.
[tool.mypy]
files = ["pm_ai"]
python_version = "3.13"
# The optional runtime extras are not installed in this environment on purpose —
# `keyring`, `msal` and `sqlite_vec` are imported inside the functions that
# use them so a missing extra cannot become a skipped test that reads as
# coverage. Their absence must not read as a type error.
[[tool.mypy.overrides]]
module = ["keyring.*", "msal.*", "sqlite_vec.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_ai"]
