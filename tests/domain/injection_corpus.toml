# The injection corpus `sanitize()` is measured against.
#
# Spec: _bmad-output/specs/spec-pm-ai/stories/8h-the-filter-measures-itself.md
# Read by: tests/domain/test_sanitization_rates.py
#
# Data, not code, so a reviewer can read what the rates were measured against.
#
# HOW PAYLOADS ARE STORED
#   Every payload is a TOML *literal* string (single quotes), so TOML decodes
#   nothing and the test does all the decoding. Only printable ASCII may appear
#   in a stored payload. Any other code point, and the backslash and the single
#   quote, is written as \uXXXX (or \UXXXXXXXX). An invisible character survives
#   neither a diff nor a whitespace-normalising hook, and an entry that silently
#   lost its carrier would make the catch rate pass for the wrong reason.
#   `claims` lists every code point the decoded payload holds outside printable
#   ASCII, with its count when it appears more than once ("U+200B x2"). The
#   test requires the claims and the decoded payload to agree exactly, so an
#   entry that lost one of two carriers is refused rather than measured.
#
# WHAT IS PINNED
#   `pinned = true` entries are the sets the spec enumerates, and the rates are
#   computed over them alone. Catch: 8g's eight attack cases. False positives:
#   8g's seven benign controls plus the known `system:` sentence. The floor,
#   the ceiling and the one permitted hit are pinned in the test against
#   `version` below.
#   `pinned = false` entries are reported on every run and do not count toward
#   either rate. Each is pinned case by case elsewhere: 8g's in its own suite,
#   and the misses this slice found in `test_a_miss_8h_found_is_still_missed`.
#
# CHANGING THIS FILE
#   Any edit to an entry changes the digest the test pins for `version`. Bump
#   `version`, add a [[changelog]] entry saying which direction each pinned
#   denominator moved and why, and re-pin in the test. Adding easy attack entries
#   raises the catch rate without improving detection. A rate is only
#   comparable to another rate measured on the same corpus version.

version = 1

[minimum]
# Pinned entries per half. The corpus is refused below this, before any rate.
attack = 8
benign = 8

[[changelog]]
version = 1
date = "2026-09-23"
rule_version = 1
denominator = """\
Initial. Pinned attack half 8, the eight cases 8g names. Pinned benign half 8, \
8g's seven original controls plus the known `system:` false positive. Reported \
entries: 8g's later controls, its admitted false positives and evasions, and \
three evasions measured while building this corpus."""

